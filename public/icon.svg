<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glow)" stroke-width="8" />

  <!-- Barcode Lines inside top -->
  <g fill="#ffffff" opacity="0.35">
    <rect x="110" y="110" width="16" height="70" rx="6" />
    <rect x="140" y="110" width="8" height="70" rx="4" />
    <rect x="162" y="110" width="24" height="70" rx="6" />
    <rect x="200" y="110" width="12" height="70" rx="4" />
    <rect x="226" y="110" width="30" height="70" rx="6" />
    <rect x="270" y="110" width="10" height="70" rx="4" />
    <rect x="294" y="110" width="20" height="70" rx="6" />
    <rect x="328" y="110" width="14" height="70" rx="4" />
    <rect x="356" y="110" width="28" height="70" rx="6" />
    <rect x="398" y="110" width="10" height="70" rx="4" />
  </g>

  <!-- Main Checkmark Circle -->
  <circle cx="256" cy="310" r="130" fill="#ffffff" opacity="0.15" />
  <circle cx="256" cy="310" r="110" fill="#ffffff" />

  <!-- Emerald Checkmark Icon -->
  <path d="M196 310 L236 350 L316 260" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
</svg>

